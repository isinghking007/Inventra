
<div class="header-summary">

                        <div class="header-summary-details">
                            <button mat-icon-button>
                                <mat-icon>menu</mat-icon>
                            </button>
                            <div class="welcome-user">
                                <mat-card-title>{{ title }}</mat-card-title>
                                <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
                            </div>

                        </div>

                        <div class="header-user-details">
                            <div class="date-picker">
                                <mat-icon>calendar_today</mat-icon>
                                <span>{{ selectedDate | date:'dd MMM yyyy' }}</span>
                                <mat-icon class="dropdown-icon">
                                    keyboard_arrow_down
                                </mat-icon>
                            </div>
                            <mat-datepicker #picker (dateChange)="onDateChange($event)"></mat-datepicker>

                            <button mat-icon-button>
                                <mat-icon>notifications</mat-icon>
                            </button>
                            <mat-card-header>
                                <div class="profile-card">
                                    <img mat-card-image
                                        src="https://material.angular.dev/assets/img/examples/shiba1.jpg"
                                        alt="Profile" />
                                </div>
                                <div class="profile-card-text">
                                    <mat-card-title>{{userName}}</mat-card-title>
                                    <mat-card-subtitle>{{userRole}}</mat-card-subtitle>

                                </div>
                                <mat-icon class="dropdown-icon">
                                    keyboard_arrow_down
                                </mat-icon>
                            </mat-card-header>
                        </div>

</div>
